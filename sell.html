<script>
document.addEventListener('DOMContentLoaded', () => {
  const defaultAvatar = 'images/user-new.svg';

  // Expanded elements
  const expLoginWrap = document.querySelector('.login-wrapper');
  const expUserWrap  = document.querySelector('.user-info-wrapper');
  const expAvatarImg = document.querySelector('.user-info-wrapper .avatar img');
  const expNameEl    = document.querySelector('.user-info-wrapper .text-block-20');

  // Collapsed elements
  const colLoginWrap = document.querySelector('.login-wrapper-copy');      // we'll keep this hidden
  const colUserWrap  = document.querySelector('.user-info-wrapper-copy');  // always visible
  const colAvatarImg = document.querySelector('.user-info-wrapper-copy .avatar-copy img');
  const colNameEl    = document.querySelector('.user-info-wrapper-copy .text-block-20');

  // Open modal from any ".loginbtn" (expanded login button)
  document.querySelectorAll('.loginbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = document.getElementById('auth-modal');
      if (m) m.style.display = 'block';
    });
  });

  // Helpers
  const show = el => { if (el) el.style.display = ''; };
  const hide = el => { if (el) el.style.display = 'none'; };
  const setImg = (el, src) => { if (el) el.src = src; };
  const setText = (el, t) => { if (el) el.textContent = t; };

  // Clicking collapsed avatar should open login ONLY when logged out
  let collapsedClickHandler = null;
  function setCollapsedAvatarLogin(enabled) {
    if (!colUserWrap) return;
    if (collapsedClickHandler) {
      colUserWrap.removeEventListener('click', collapsedClickHandler);
      collapsedClickHandler = null;
      colUserWrap.style.cursor = '';
    }
    if (enabled) {
      collapsedClickHandler = () => {
        const m = document.getElementById('auth-modal');
        if (m) m.style.display = 'block';
      };
      colUserWrap.addEventListener('click', collapsedClickHandler);
      colUserWrap.style.cursor = 'pointer';
    }
  }

  // Initial UI
  // Expanded: show login, hide user
  show(expLoginWrap);  hide(expUserWrap);

  // Collapsed: HIDE collapsed login block; SHOW avatar block with default avatar
  hide(colLoginWrap);
  show(colUserWrap);
  setImg(colAvatarImg, defaultAvatar);
  setText(colNameEl, 'Guest');
  setCollapsedAvatarLogin(true);

  // Auth state
  firebase.auth().onAuthStateChanged(user => {
    const loggedIn = !!user;
    const photo = (user && user.photoURL) ? user.photoURL : defaultAvatar;
    const name  = (user && (user.displayName || user.email)) || 'Guest';

    // Expanded
    if (loggedIn) { hide(expLoginWrap); show(expUserWrap); }
    else          { show(expLoginWrap); hide(expUserWrap); }
    setImg(expAvatarImg, photo);
    setText(expNameEl, name);

    // Collapsed: always avatar area (never the login button)
    hide(colLoginWrap);
    show(colUserWrap);
    setImg(colAvatarImg, photo);
    setText(colNameEl, name);
    setCollapsedAvatarLogin(!loggedIn);
  });
});
</script>
